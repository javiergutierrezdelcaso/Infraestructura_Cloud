---
# Tareas del rol "microservicio"
# Instala dependencias y prepara la VM para ejecutar FastAPI como servicio systemd

# ─────────────────────────────────────────────
# 1. Actualizar paquetes del sistema
# ─────────────────────────────────────────────
- name: Actualizar lista de paquetes
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Instalar paquetes base
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - curl
    state: present

# ─────────────────────────────────────────────
# 2. Crear directorio de la aplicación
# ─────────────────────────────────────────────
- name: Crear directorio de la aplicación
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

# ─────────────────────────────────────────────
# 3. Crear entorno virtual Python
# ─────────────────────────────────────────────
- name: Crear entorno virtual Python en {{ app_dir }}
  ansible.builtin.command:
    cmd: python3 -m venv {{ app_dir }}/venv
    creates: "{{ app_dir }}/venv"
  become_user: "{{ app_user }}"

# ─────────────────────────────────────────────
# 4. Instalar dependencias Python (FastAPI + Uvicorn)
# ─────────────────────────────────────────────
- name: Instalar FastAPI y Uvicorn en el entorno virtual
  ansible.builtin.pip:
    name:
      - fastapi
      - uvicorn[standard]
    virtualenv: "{{ app_dir }}/venv"
    state: present

# ─────────────────────────────────────────────
# 5. Crear servicio systemd para el microservicio
#    Permite que FastAPI arranque automáticamente con la VM
# ─────────────────────────────────────────────
- name: Crear archivo de servicio systemd
  ansible.builtin.copy:
    dest: /etc/systemd/system/microservicio.service
    mode: "0644"
    content: |
      [Unit]
      Description=Microservicio FastAPI TFG
      After=network.target

      [Service]
      User={{ app_user }}
      WorkingDirectory={{ app_dir }}
      ExecStart={{ app_dir }}/venv/bin/uvicorn main:app --host 0.0.0.0 --port {{ app_port }}
      Restart=always
      RestartSec=5
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

- name: Recargar systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Habilitar servicio microservicio al arranque
  ansible.builtin.systemd:
    name: microservicio
    enabled: true
    state: started
