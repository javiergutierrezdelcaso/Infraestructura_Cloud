---
- name: Actualizar lista de paquetes
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Instalar paquetes base
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - curl
    state: present

- name: Crear directorio de la aplicación
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Crear entorno virtual Python
  ansible.builtin.command:
    cmd: python3 -m venv {{ app_dir }}/venv
    creates: "{{ app_dir }}/venv"
  become_user: "{{ app_user }}"

- name: Instalar FastAPI y Uvicorn
  ansible.builtin.pip:
    name:
      - fastapi
      - "uvicorn[standard]"
    virtualenv: "{{ app_dir }}/venv"
    state: present

- name: Crear servicio systemd con variable ENTORNO
  ansible.builtin.copy:
    dest: /etc/systemd/system/microservicio.service
    mode: "0644"
    content: |
      [Unit]
      Description=EcoAnalyzer — Microservicio FastAPI TFG
      After=network.target

      [Service]
      User={{ app_user }}
      WorkingDirectory={{ app_dir }}
      Environment=ENTORNO={{ entorno_tipo }}
      ExecStart={{ app_dir }}/venv/bin/uvicorn main:app --host 0.0.0.0 --port {{ app_port }}
      Restart=always
      RestartSec=5
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

- name: Recargar systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Habilitar y arrancar servicio
  ansible.builtin.systemd:
    name: microservicio
    enabled: true
    state: started
