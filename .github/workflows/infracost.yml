name: Infracost — Previsión de Costes

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  infracost:
    name: Infracost
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write # Obligatorio para que el token pueda escribir el comentario

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      # 1. Instalar y configurar el CLI de Infracost
      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      # 2. Generar el desglose de costes en formato JSON
      - name: Generate Infracost JSON
        run: infracost breakdown --path . --format json --out-file /tmp/infracost.json

      # 3. Publicar el comentario usando directamente el CLI nativo (Sin usar uses)
      - name: Post Infracost comment
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          infracost comment github --path /tmp/infracost.json \
                                   --repo ${{ github.repository }} \
                                   --pull-request ${{ github.event.pull_request.number }} \
                                   --behavior update
