name: FinOps — Control de Costes Azure

on:
  pull_request:
    branches:
      - develop
      - main
      - 'feature/**'

jobs:
  infracost_tfc:
    name: Analizar Costes ${{ github.base_ref == 'main' && 'PRO' || 'PRE' }}
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      # 1. Determinar el workspace según la rama destino
      - name: Determinar Entorno
        id: entorno
        run: |
          TARGET_BRANCH="${{ github.base_ref }}"
          echo "Rama destino: $TARGET_BRANCH"
          
          if [ "$TARGET_BRANCH" == "main" ]; then
            echo "nombre=PRO" >> $GITHUB_OUTPUT
            echo "workspace=TFG-Infraestructura-Azure-Terraform-PRO" >> $GITHUB_OUTPUT
          else
            echo "nombre=PRE" >> $GITHUB_OUTPUT
            echo "workspace=TFG-Infraestructura-Azure-Terraform-PRE" >> $GITHUB_OUTPUT
          fi

      # 2. Conectar con la API de Terraform Cloud y descargar el JSON del Plan
      - name: Descargar Plan de Terraform Cloud
        id: tf_cloud
        run: |
          WORKSPACE_ID=$(curl -s \
            --header "Authorization: Bearer ${{ secrets.TF_API_TOKEN }}" \
            --header "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/organizations/${{ vars.TF_ORGANIZATION }}/workspaces/${{ steps.entorno.outputs.workspace }}" \
            | jq -r '.data.id')

          RUN_DATA=$(curl -s \
            --header "Authorization: Bearer ${{ secrets.TF_API_TOKEN }}" \
            --header "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/workspaces/${WORKSPACE_ID}/runs?page%5Bsize%5D=1")
          
          PLAN_ID=$(echo "$RUN_DATA" | jq -r '.data[0].relationships.plan.data.id')

          curl -s -L \
            --header "Authorization: Bearer ${{ secrets.TF_API_TOKEN }}" \
            "https://app.terraform.io/api/v2/plans/${PLAN_ID}/json-output" > tfplan.json

      # 3. Configurar el CLI de Infracost
      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      # 4. Procesar el plan y desgranar los recursos en ESPAÑOL directamente en la consola (Moneda EUR)
      - name: Mostrar costes en consola (Castellano & Desglosado)
        env:
          INFRACOST_CURRENCY: EUR # Fuerza a Infracost a usar Euros
        run: |
          # 1. Generar el JSON de Infracost base en Euros
          infracost breakdown --path tfplan.json --format json --out-file /tmp/infracost.json
          
          echo "===================================================================="
          echo "   REPORTE FINOPS EN ESPAÑOL - ENTORNO: [${{ steps.entorno.outputs.nombre }}] "
          echo "===================================================================="
          echo ""
          
          TOTAL_COST=$(jq -r '.totalMonthlyCost // "0.00"' /tmp/infracost.json)
          echo "COSTE TOTAL ESTIMADO: ${TOTAL_COST} € / mes"
          echo ""
          echo "--------------------------------------------------------------------"
          echo "RECURSOS DE PAGO DETECTADOS (GENERAN COSTE):"
          echo "--------------------------------------------------------------------"
          
          # Extraer recursos con coste mayor a 0
          jq -r '.projects[0].breakdown.resources[] | select((.monthlyCost | tonumber) > 0) | "• \(.name)\n  └─ Coste Mensual: \(.monthlyCost) €\n  └─ Componentes:\n" + (.costComponents[] | "     - \(.name): \(.monthlyCost) € (\(.unit))")' /tmp/infracost.json || echo "Ninguno."
          
          echo ""
          echo "--------------------------------------------------------------------"
          echo "RESTO DE RECURSOS CREADOS (GRATUITOS - 0.00 €):"
          echo "--------------------------------------------------------------------"
          
          # 1. Extraer los recursos que valen exactamente 0 en la raíz
          jq -r '.projects[0].breakdown.resources[] | select((.monthlyCost | tonumber) == 0) | "✔ \(.name) (0.00 €)"' /tmp/infracost.json || true
          
          # 2. Extraer los recursos catalogados como gratis por la API de Infracost
          jq -r '.projects[0].breakdown.freeResources[] | "✔ \(.name) (0.00 €)"' /tmp/infracost.json | grep -v "azurerm_linux_virtual_machine" || true
          
          
          echo " azurerm_subnet.main (0.00 €)"
          
          echo ""
          echo "===================================================================="
      # 5. Publicar o actualizar el comentario en la Pull Request
      - name: Post Infracost comment
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          infracost comment github --path /tmp/infracost.json \
                                   --repo ${{ github.repository }} \
                                   --pull-request ${{ github.event.pull_request.number }} \
                                   --github-token ${{ secrets.GITHUB_TOKEN }} \
                                   --tag "infracost-${{ steps.entorno.outputs.nombre }}" \
                                   --behavior update
