name: Infracost — Previsión de Costes

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  infracost:
    name: Infracost
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      # 1. Configurar Infracost CLI
      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      # 2. Generar el desglose de costes en formato JSON
      - name: Generate Infracost JSON
        run: infracost breakdown --path . --format json --out-file /tmp/infracost.json

      # 3. Publicar el comentario en la Pull Request (Ruta corregida)
      - name: Post Infracost comment
        uses: infracost/actions/comment@v3
        with:
          path: /tmp/infracost.json
          behavior: update
